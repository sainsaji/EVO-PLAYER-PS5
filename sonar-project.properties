# SonarCloud / SonarQube Configuration for EVO Player (PS5)

sonar.projectKey=sainsaji_EVO-PLAYER-PS5
sonar.organization=sainsaji
sonar.projectName=EVO Player PS5

# Source and Test directories
sonar.sources=projects/evoplayer
