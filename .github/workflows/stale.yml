name: Stale Issue & PR Management

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-milestones: true
          exempt-all-issue-milestones: true
          exempt-all-pr-milestones: true
          exempt-issue-labels: 'pinned,security,good first issue'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has had no recent activity for 60 days. It will be closed in 14 days if no further activity occurs.
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has had no recent activity for 60 days. It will be closed in 14 days if no further activity occurs.
          close-issue-message: |
            This issue was closed because it has been stalled for 14 days with no activity. Feel free to re-open or submit a new issue if still applicable.
          close-pr-message: |
            This pull request was closed due to inactivity.
