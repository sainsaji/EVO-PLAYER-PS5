name: Issue Triage & Auto-Labeler

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Label Issue by Title & Content
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const labelsToAdd = new Set();

            // Type classification
            if (title.includes('[bug]') || title.includes('bug:') || title.includes('crash') || title.includes('error')) {
              labelsToAdd.add('bug');
            }
            if (title.includes('[feature]') || title.includes('feat:') || title.includes('[enhancement]')) {
              labelsToAdd.add('enhancement');
            }
            if (title.includes('[performance]') || title.includes('perf:') || title.includes('fps') || title.includes('latency') || title.includes('stall')) {
              labelsToAdd.add('performance');
            }
            if (title.includes('[docs]') || title.includes('doc:') || title.includes('readme')) {
              labelsToAdd.add('documentation');
            }

            // Domain classification
            if (title.includes('emby') || title.includes('jellyfin') || title.includes('addon') || body.includes('emby')) {
              labelsToAdd.add('addons');
            }
            if (title.includes('sub') || title.includes('subtitle') || title.includes('srt') || title.includes('ass')) {
              labelsToAdd.add('subtitles');
            }
            if (title.includes('audio') || title.includes('surround') || title.includes('5.1') || title.includes('7.1') || title.includes('sound')) {
              labelsToAdd.add('audio');
            }
            if (title.includes('http') || title.includes('tls') || title.includes('ssl') || title.includes('socket') || title.includes('network')) {
              labelsToAdd.add('network');
            }
            if (title.includes('ui') || title.includes('osd') || title.includes('menu') || title.includes('keyboard') || title.includes('dialog')) {
              labelsToAdd.add('ui');
            }
            if (title.includes('memory') || title.includes('heap') || title.includes('dmem') || title.includes('slab') || title.includes('alloc')) {
              labelsToAdd.add('memory');
            }
            if (title.includes('playback') || title.includes('decode') || title.includes('avx2') || title.includes('simd') || title.includes('hevc')) {
              labelsToAdd.add('playback');
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: Array.from(labelsToAdd)
              });
            }
