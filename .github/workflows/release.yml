# =============================================================================
# EVO Player release
#
# Builds the player in the same pinned Docker environment developers use, then
# publishes the payload and an installable homebrew bundle.
#
# Triggered by pushing a tag:
#     git tag v0.0.1 && git push origin v0.0.1
# or manually from the Actions tab.
#
# The PS5 is obviously not present on a runner, so nothing here is
# hardware-tested. Release notes say so explicitly rather than implying a
# verification that did not happen.
# =============================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      # The VERSION file and the tag must agree, otherwise the player reports a
      # different version than the release it came from.
      - name: Check VERSION matches the tag
        run: |
          FILE_VER="$(tr -d '[:space:]' < projects/evoplayer/VERSION)"
          WANT="${{ steps.ver.outputs.version }}"
          if [ "$FILE_VER" != "$WANT" ]; then
            echo "::error::projects/evoplayer/VERSION is '$FILE_VER' but the tag says '$WANT'"
            exit 1
          fi
          echo "VERSION $FILE_VER matches tag"

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: evo-player/ps5-dev:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Builds the player AND the tile payloads - build-media-tile.sh calls
      # build-evoplayer.sh itself, so the player it embeds is always the one
      # just built. There is deliberately no separate player step: two steps
      # meant two chances to embed a stale build, and the tile carries the
      # player inside it where nothing downstream can see the version.
      #
      # The tile installer is the file most people actually run. EVOPlayer.elf
      # is the bare player and needs hbldr for a display plane, so sending it
      # straight to elfldr - which is what every payload manager does - starts
      # it headless and nothing appears. That was reported as "the release does
      # not work", and it was: we shipped the wrong ELF.
      - name: Build the player and the Media tile payloads
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            evo-player/ps5-dev:release \
            bash -lc 'bash ./scripts/build-media-tile.sh'

      - name: Build the sample suite
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            evo-player/ps5-dev:release \
            bash -lc 'bash ./scripts/build.sh'

      - name: Package installable homebrew bundle
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            evo-player/ps5-dev:release \
            bash -lc 'bash ./scripts/package-pkg.sh --format homebrew \
                        --title "EVO Player" output/elf/EVOPlayer.elf'

      - name: Verify the payload is a PS5 ELF
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            evo-player/ps5-dev:release bash -lc '
              set -e
              for f in output/elf/EVOPlayer.elf \
                       output/elf/EVOPlayer_MediaLauncher.elf \
                       output/elf/EVOPlayer_UninstallTile.elf; do
                [ -f "$f" ] || { echo "missing $f"; exit 1; }
                file "$f" | grep -q "ELF 64-bit LSB.*x86-64" \
                  || { echo "$f is not a PS5 ELF"; exit 1; }
                llvm-readelf -l "$f" | grep -q "/lib64/ld-linux" \
                  && { echo "$f links the host loader - wrong compiler"; exit 1; }
                echo "ok: $f  $(stat -c %s "$f") bytes"
              done

              # The launcher embeds the player, so it must be larger. A
              # launcher that is suddenly small means the .incbin picked up
              # nothing - which ships a tile that opens to a black screen.
              p=$(stat -c %s output/elf/EVOPlayer.elf)
              l=$(stat -c %s output/elf/EVOPlayer_MediaLauncher.elf)
              [ "$l" -gt "$p" ] || {
                echo "launcher ($l) not larger than player ($p) - embed failed"
                exit 1
              }
              echo "ok: launcher embeds the player ($l > $p)"
            '

      - name: Collect artifacts
        run: |
          mkdir -p dist
          T="${{ steps.ver.outputs.tag }}"

          # Named so the right file is obvious in the releases list. The tile
          # installer is what a payload manager should be pointed at; the bare
          # player is kept for the homebrew/websrv route, suffixed so nobody
          # reaches for it by mistake.
          cp output/elf/EVOPlayer_MediaLauncher.elf "dist/EVOPlayer-${T}-InstallTile.elf"
          cp output/elf/EVOPlayer_UninstallTile.elf "dist/EVOPlayer-${T}-UninstallTile.elf"
          cp output/elf/EVOPlayer.elf               "dist/EVOPlayer-${T}-player-only.elf"

          if [ -f output/pkg/EVOPlayer-homebrew.zip ]; then
            cp output/pkg/EVOPlayer-homebrew.zip \
               "dist/EVOPlayer-${T}-homebrew.zip"
          fi
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -la dist

      # Pull this version's section out of CHANGELOG.md so the release says
      # what actually changed. Without this every release carried the same
      # boilerplate and nothing about its own contents.
      - name: Extract changelog section
        run: |
          V="${{ steps.ver.outputs.version }}"
          if awk -v v="## ${V}" '
                $0 == v {found=1; next}
                found && /^## / {exit}
                found {print}
              ' CHANGELOG.md > dist_notes_body.md && [ -s dist_notes_body.md ]; then
            echo "found changelog section for ${V}"
          else
            echo "::warning::no CHANGELOG.md section for ${V} - notes will be boilerplate only"
            : > dist_notes_body.md
          fi

      - name: Release notes
        run: |
          mkdir -p dist
          if [ -s dist_notes_body.md ]; then
            cat dist_notes_body.md > dist/NOTES.md
            echo "" >> dist/NOTES.md
            echo "---" >> dist/NOTES.md
            echo "" >> dist/NOTES.md
          fi
          cat >> dist/NOTES.md <<'EOF'
          ## Install — start here

          **Download `EVOPlayer-*-InstallTile.elf`.** That is the one to run.

          1. Jailbreak the console (12.70) and start `ps5-payload-elfldr`.
          2. Copy `EVOPlayer-*-InstallTile.elf` to a USB stick.
          3. Start it from your **payload manager** — the on-console one,
             typically at `http://<ps5>:8084`. Anything that sends an ELF to
             elfldr works.
          4. It says **"EVO Player ready in Media"**. Open EVO Player from the
             console's **Media** row.

          That is the whole install. **No websrv, no FTP, nothing to extract**,
          and no second device beyond whatever runs your payload manager — the
          tile installer carries the player inside it.

          > **Keep the payload running.** It is resident by design — it is what
             starts the player when you open the tile. Your payload manager may
             show it as still running; that is correct.
          >
          > **Re-run it after every reboot**, along with the jailbreak.

          ### Which file is which

          | File | Use it for |
          |---|---|
          | `EVOPlayer-*-InstallTile.elf` | **Normal install.** Payload manager → tile in Media |
          | `EVOPlayer-*-UninstallTile.elf` | Removes the tile completely |
          | `EVOPlayer-*-homebrew.zip` | The websrv route: extract to a USB stick as `/homebrew/EVOPlayer/`, launch from `http://<ps5>:8080` |
          | `EVOPlayer-*-player-only.elf` | The bare player. **Do not send this to a payload manager** — with `elfldr` alone it runs headless with no display plane and nothing appears. It needs `hbldr`, which the tile installer and websrv provide |

          ## Requirements

          * PS5 on firmware **12.70**, jailbroken (re-run after every reboot)
          * A USB stick for media

          ## Verification

          Built reproducibly in CI from the pinned toolchain (clang 18.1.3,
          PS5 Payload SDK v0.42, FFmpeg 7.0.1). **CI has no console, so these
          binaries are not hardware-tested.** Checksums in `SHA256SUMS.txt`.

          Licensed GPL-3.0-or-later. Derived from ProsperoPlayer; see NOTICE.
          EOF
          cat dist/NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: EVO Player ${{ steps.ver.outputs.tag }}
          body_path: dist/NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/EVOPlayer-*.elf
            dist/EVOPlayer-*-homebrew.zip
            dist/SHA256SUMS.txt
