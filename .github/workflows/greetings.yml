name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **EVO Player**! Thanks for opening your first issue in this repository.
            
            - Please ensure all logs and firmware / system context are included.
            - Check our [Roadmap](https://github.com/sainsaji/EVO-PLAYER-PS5/blob/main/docs/improvements-roadmap.md) to see related ongoing milestones.
          pr-message: |
            🎉 Welcome and thank you for your contribution to **EVO Player**!
            
            - Our automated build workflows will run validation checks on this pull request shortly.
            - Please make sure changes adhere to project standards and have been tested against PS5 homebrew toolchains where possible.
