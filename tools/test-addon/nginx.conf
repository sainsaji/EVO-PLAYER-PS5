# nginx for the test addon: the generated JSON at /, the media folder at
# /media. Stremio clients fetch cross-origin, so every response is CORS-open.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Ids are evotest-<n> (no colon: the files live on NTFS).
    location / {
        default_type application/json;
        try_files $uri $uri.json =404;
    }

    location /media/ {
        alias /media/;
        default_type application/octet-stream;
    }
}
