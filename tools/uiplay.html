<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVO Player — RmlUi screens</title>
<style>
  :root { --bg:#0b0d12; --fg:#e8eef7; --dim:#7d8798; --line:#252a35; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:15px; font-weight:600; }
  header p { margin:4px 0 0; color:var(--dim); }
  main { display:grid; gap:18px; padding:22px;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); }
  figure { margin:0; border:1px solid var(--line); border-radius:8px; overflow:hidden;
    background:#000; cursor:zoom-in; }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding:8px 10px; color:var(--dim); font-size:12px;
    border-top:1px solid var(--line); background:var(--bg); }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none;
    align-items:center; justify-content:center; cursor:zoom-out; z-index:10; }
  #lightbox img { max-width:98vw; max-height:98vh; }
</style>
<header>
  <h1>EVO Player — RmlUi screens</h1>
  <p>Contact sheet of every screen the RmlUi host harness renders, including the
     #16 <code>*_stress</code> fixtures. Real RmlUi drawing code and assets;
     not interactive. Click a frame to enlarge.</p>
</header>
<main id="grid"></main>
<div id="lightbox"><img alt=""></div>
<script>
function renderGallery() {
  const grid = document.getElementById('grid');
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  (window.FRAMES || []).slice().sort().forEach(name => {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = name; img.alt = name; img.loading = 'lazy';
    const cap = document.createElement('figcaption');
    cap.textContent = name.replace(/^rml_/, '').replace(/\.png$/, '');
    fig.append(img, cap);
    fig.addEventListener('click', () => { lbImg.src = name; lb.style.display = 'flex'; });
    grid.append(fig);
  });
  lb.addEventListener('click', () => { lb.style.display = 'none'; lbImg.src = ''; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { lb.style.display = 'none'; lbImg.src = ''; }
  });
}
</script>
